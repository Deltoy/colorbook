<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>배색사전</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F5F6F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1A1A" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#F5F6F8;--card:#fff;--line:#EDEEF0;--line2:#E3E5E8;--ink:#111827;--ink2:#4B5563;--mut:#646B78;--pri:#155EEF;--pri-bg:#EEF4FF;--best:#155EEF;--warn-bg:#FFFBEB;--warn-bd:#FDE68A;--warn:#92400E;--r:20px;--r2:12px;--sh:0 1px 3px rgba(0,0,0,.04);--ghost:.16}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#1A1A1A;--card:#242424;--line:#303030;--line2:#3A3A3A;--ink:#F3F4F6;--ink2:#C7CBD3;--mut:#9AA0AB;--pri:#5B8DEF;--pri-bg:#1E2A44;--best:#7FA6F5;--warn-bg:#2B2414;--warn-bd:#6B5520;--warn:#F5D58A;--ghost:.14}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Pretendard Variable',Pretendard,-apple-system,system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,[role=button]:focus-visible,label.btn:focus-within{outline:3px solid var(--pri);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:1180px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 0 12px}
header.top h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0;flex:1}
.lens{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 14px 0 12px;border-radius:999px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line2);font-size:14px;font-weight:600}
.lens .sw{width:36px;height:22px;border-radius:999px;background:var(--line2);position:relative;transition:background .2s}
.lens .sw::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s}
.lens[aria-pressed=true] .sw{background:var(--pri)}.lens[aria-pressed=true] .sw::after{transform:translateX(14px)}
.bar{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 12px;scroll-padding-inline:16px;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}.bar::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:44px;padding:0 14px;border-radius:999px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line2);font-size:14px;font-weight:600;color:var(--ink2);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--card);box-shadow:none}
.chip i{width:12px;height:12px;border-radius:50%;display:inline-block}
.sum{font-size:14px;color:var(--mut);margin:0 0 12px}
.sum b{color:var(--ink)}
/* 배색 판 */
.plates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:640px){.plates{grid-template-columns:repeat(3,1fr)}}
@media (min-width:860px){.plates{grid-template-columns:repeat(4,1fr)}}
@media (min-width:1100px){.plates{grid-template-columns:repeat(5,1fr)}}
.plate{display:block;width:100%;text-align:left;background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh),inset 0 0 0 1px var(--line)}
.bands{display:flex;aspect-ratio:4/3}
.bands span{flex:1;position:relative}
.plate .cap{display:flex;align-items:center;gap:6px;padding:10px 12px 12px}
.plate .no{font-size:16px;font-weight:700}.plate .lbl{font-size:12px;color:var(--mut);margin-left:2px}
.hero{display:block;width:100%;text-align:left;background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh),inset 0 0 0 1px var(--line);margin:0 0 16px}
.hero .hb{display:flex;height:168px}
@media (min-width:860px){.hero .hb{height:220px}}
.hero .hb span{flex:1;display:flex;align-items:flex-end;padding:10px 12px}
.hero .hb em{font-style:normal;font-size:12px;font-weight:600;color:#111827;background:rgba(255,255,255,.88);padding:3px 8px;border-radius:999px;line-height:1.3}
.hero .hc{padding:12px 14px 14px}
.hero .hc b{display:block;font-size:16px}.hero .hc b span{color:var(--mut);margin-left:6px}.hero .hc small{display:block;font-size:14px;color:var(--mut);margin-top:2px}
.fitdots{display:flex;gap:3px}.fitdots i{width:8px;height:8px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--mut)}.fitdots i.b{background:var(--best);box-shadow:none}.fitdots i.g{box-shadow:inset 0 0 0 2px var(--best)}
.heart{width:16px;height:16px;color:#E5484D}
.bands span{transition:flex-grow .3s cubic-bezier(.2,.8,.2,1)}.lens-on .plate:not(:has(.bands span:not(.ghost))) .bands{opacity:.55}.lens-on .bands span{flex-grow:3.5}.lens-on .bands span.ghost{flex-grow:1}
.cc .sw{transition:transform .3s cubic-bezier(.2,.8,.2,1),border-radius .3s}.lens-on .cc:has(.ghost){order:1}.lens-on .cc .sw.ghost{aspect-ratio:auto;height:28px;border-radius:8px}
/* 색 사전 */
.fam{margin:4px 0 20px}.fam h2{font-size:16px;font-weight:700;margin:0 0 10px}
.chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (min-width:640px){.chips{grid-template-columns:repeat(6,minmax(0,1fr))}}@media (min-width:1000px){.chips{grid-template-columns:repeat(9,minmax(0,1fr))}}
.cc{display:block;text-align:left;min-width:0}.fitwrap>*,.stage>.slots{min-width:0}
.cc .sw{aspect-ratio:1;border-radius:var(--r2);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);position:relative;transition:opacity .25s}
.cc .sw .st{position:absolute;right:6px;bottom:6px;width:20px;height:20px;border-radius:50%;background:#fff;color:var(--best);display:grid;place-items:center;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.cc small{display:block;font-size:12px;color:var(--ink2);margin-top:4px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 시트 */
.scrim{position:fixed;inset:0;background:rgba(17,24,39,.4);z-index:40;animation:fade .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92dvh;overflow-y:auto;background:var(--card);border-radius:24px 24px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));animation:rise .26s cubic-bezier(.2,.8,.2,1)}
.sheet .chips{grid-template-columns:repeat(4,minmax(0,1fr))}@media (min-width:480px){.sheet .chips{grid-template-columns:repeat(6,minmax(0,1fr))}}
@media (min-width:860px){.sheet{left:50%;right:auto;width:560px;transform:translateX(-50%);bottom:24px;border-radius:24px;animation:none}}
@keyframes rise{from{transform:translateY(24px);opacity:.6}}@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sh{display:flex;align-items:center;gap:8px;position:sticky;top:-8px;background:var(--card);padding:10px 0;z-index:1}
.sh h2{font-size:20px;font-weight:800;margin:0;flex:1}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink2)}
.ib:hover{background:var(--bg)}
.big{display:flex;height:180px;border-radius:var(--r);overflow:hidden;margin:4px 0 16px;box-shadow:inset 0 0 0 1px var(--line)}
.big span{flex:1}
.crow{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.crow:first-child{border-top:0}
.crow .sw{width:48px;height:48px;border-radius:var(--r2);flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.crow .t{flex:1;min-width:0}.crow b{display:block;font-size:15px}.crow small{display:block;font-size:13px;color:var(--mut)}
.grade{flex:0 0 auto;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.grade.best{background:var(--pri-bg);color:var(--best)}.grade.good{background:var(--pri-bg);color:var(--ink2)}.grade.ok{background:var(--bg);color:var(--mut)}.grade.avoid{background:var(--warn-bg);color:var(--warn)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.btn{min-height:48px;border-radius:var(--r2);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line2)}
.btn.pri{background:#155EEF;color:#fff;box-shadow:none}
.note{font-size:13px;color:var(--mut);margin:10px 0 0}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
@media (min-width:480px){.mini{grid-template-columns:repeat(4,1fr)}}
.mini .plate .cap{padding:6px 8px 8px}.mini .plate .no{font-size:13px}
.h3{font-size:15px;font-weight:700;margin:18px 0 0}
/* 코디 */
.fitwrap{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:860px){.fitwrap{grid-template-columns:340px minmax(0,1fr);align-items:start}}
.stage{background:var(--card);border-radius:var(--r);box-shadow:var(--sh),inset 0 0 0 1px var(--line);padding:12px;display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;align-items:center}
@media (max-width:400px){.stage{grid-template-columns:118px minmax(0,1fr)}}
@media (min-width:860px){.stage{position:sticky;top:76px}}
.stage>svg{width:100%;height:auto;display:block}
.stage svg .pt{cursor:pointer;transition:fill .2s}
.slots{display:grid;gap:6px}
.slot{display:flex;align-items:center;gap:10px;min-height:44px;padding:4px 8px 4px 4px;border-radius:12px;text-align:left}
.slot:hover{background:var(--bg)}
.slot .sw{width:36px;height:36px;border-radius:10px;flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.slot .sw.none{background:repeating-linear-gradient(135deg,var(--bg) 0 6px,var(--line) 6px 8px)}
.slot .t{flex:1;min-width:0;font-size:14px;line-height:1.25}.slot .t small{display:block;color:var(--mut);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .wn{width:18px;height:18px;color:var(--warn)}
.stage .foot{grid-column:1/-1;display:flex;gap:8px}
.stage .foot .btn{flex:1;min-height:44px;font-size:14px}
@media (min-width:860px){.sugs,.looks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-content:start}.sugs>:not(.sug),.looks>:not(.sug){grid-column:1/-1}.sugs .sug,.looks .sug{margin-top:0}}
.sugs h2{font-size:16px;font-weight:700;margin:0 0 4px}
.sug{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:var(--r);box-shadow:var(--sh),inset 0 0 0 1px var(--line);padding:10px;margin-top:10px}
.sug .bands{width:120px;aspect-ratio:auto;height:72px;border-radius:12px;overflow:hidden;flex:0 0 auto}
.sug .t{flex:1;min-width:0;font-size:14px}.sug .t b{display:block;font-size:15px}.sug .t small{color:var(--mut)}
.sug .btn{min-height:44px;flex:0 0 auto}
.warn{display:flex;gap:8px;align-items:flex-start;background:var(--warn-bg);box-shadow:inset 0 0 0 1px var(--warn-bd);color:var(--warn);border-radius:var(--r2);padding:10px 12px;font-size:14px;margin-top:10px}
.empty{background:var(--card);border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--line);padding:20px;font-size:15px;color:var(--ink2)}
.empty b{color:var(--ink)}
/* 사진 */
.photo{position:relative;border-radius:var(--r);overflow:hidden;background:var(--bg);touch-action:none}
.photo canvas{display:block;width:auto;max-width:100%;max-height:45dvh;height:auto;margin:0 auto;cursor:crosshair}
.photo .tip{position:absolute;left:8px;top:8px;background:rgba(17,24,39,.7);color:#fff;font-size:13px;padding:4px 10px;border-radius:999px}
.pick{display:flex;align-items:center;gap:10px;margin-top:10px}
.pick .sw{width:44px;height:44px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
/* 하단 탭 */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--mut)}
nav.tabs button[aria-current=page]{color:var(--pri)}nav.tabs button:focus-visible{outline-offset:-4px;border-radius:16px}
nav.tabs svg{width:24px;height:24px}
@media (min-width:860px){nav.tabs{left:50%;right:auto;bottom:16px;transform:translateX(-50%);width:420px;border-radius:999px;border:0;box-shadow:0 4px 16px rgba(0,0,0,.08),inset 0 0 0 1px var(--line);overflow:hidden}}
.toast{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--card);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;animation:fade .2s}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="tabs" aria-label="메뉴" id="tabs"></nav>
<div id="sheet"></div>
<script src="data.js"></script>
<script>
'use strict';
// ---------- 상태 ----------
var C = CB.colors, P = CB.combos, byNo = {}; P.forEach(function (p) { byNo[p.no] = p; });
var store = { get: function (k, d) { try { var v = localStorage.getItem('cb.' + k); if (v == null) return d; var r = JSON.parse(v); return r != null && typeof r === typeof d && Array.isArray(r) === Array.isArray(d) ? r : d; } catch (e) { return d; } }, set: function (k, v) { try { localStorage.setItem('cb.' + k, JSON.stringify(v)); } catch (e) {} } };
var S = { tab: store.get('tab', 'plates'), lens: store.get('lens', true), size: 0, fam: -1, mineP: store.get('mineP', 0), mineC: store.get('mineC', false), sort: 'no', favs: store.get('favs', []), outfit: store.get('outfit', {}), looks: store.get('looks', []) };
S.favs = S.favs.filter(function (no) { return byNo[no]; }); S.looks = S.looks.filter(function (l) { return l && l.o && typeof l.o === 'object' && Object.keys(l.o).every(function (k) { return C[l.o[k]]; }); }); Object.keys(S.outfit).forEach(function (k) { if (!C[S.outfit[k]]) delete S.outfit[k]; });
var FAMS = ['분홍·빨강', '노랑·갈색', '초록', '파랑·청록', '보라', '무채색'];
var FAM_DOT = ['#e1868d', '#d9b26b', '#7ea777', '#5a82b3', '#9a7fb8', '#9aa0a6'];
var GRADE = { best: '여름뮤트 베스트', good: '잘 어울려요', ok: '무난해요', avoid: '피하는 게 좋아요' };
var SLOTS = [['scarf', '머플러·스카프', true], ['outer', '아우터', false], ['top', '상의', true], ['bottom', '하의', false], ['bag', '가방', false], ['shoes', '신발', false]];
var I = {
  plates: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  colors: '<circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.9 0 1.7-.8 1.7-1.7 0-.4-.2-.8-.4-1.1-.3-.3-.4-.7-.4-1.1 0-.9.8-1.7 1.7-1.7H16c3.1 0 5.6-2.5 5.6-5.6C21.9 6 17.5 2 12 2z"/>',
  outfit: '<path d="M20.4 6.6 16 4l-2 2h-4L8 4 3.6 6.6a1 1 0 0 0-.4 1.3l1.5 3a1 1 0 0 0 1.2.5L7 11v9a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-9l1.1.4a1 1 0 0 0 1.2-.5l1.5-3a1 1 0 0 0-.4-1.3z"/>',
  saved: '<path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>', star: '<path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/>',
  camera: '<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/>',
  alert: '<path d="m21.7 18-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3z"/><path d="M12 9v4M12 17h.01"/>',
  trash: '<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>', reset: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>'
};
function ic(n, cls) { return '<svg class="ic ' + (cls || '') + '" viewBox="0 0 24 24" aria-hidden="true">' + I[n] + '</svg>'; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function good(i) { return C[i].gr === 'best' || C[i].gr === 'good'; }
function comboFit(p) { var b = 0, g = 0; p.c.forEach(function (i) { if (C[i].gr === 'best') b++; else if (C[i].gr === 'good') g++; }); return { b: b, g: g, all: b + g === p.c.length, near: p.c.length > 2 && b + g >= p.c.length - 1, odd: p.c.filter(function (i) { return !good(i); }), score: p.c.reduce(function (s, i) { return s + C[i].s; }, 0) / p.c.length }; }
function ghost(i) { return S.lens && !good(i) ? ' ghost' : ''; }
function toast(t) { document.querySelectorAll('.toast').forEach(function (e) { e.remove(); }); var el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); el.textContent = t; document.body.appendChild(el); setTimeout(function () { el.remove(); }, 2400); }
function isFav(no) { return S.favs.indexOf(no) >= 0; }

// ---------- 공통 조각 ----------
function bands(p) { return '<div class="bands">' + p.c.map(function (i) { return '<span class="' + ghost(i).trim() + '" style="background:' + C[i].hex + '"></span>'; }).join('') + '</div>'; }
function plateCard(p) {
  var f = comboFit(p);
  return '<button class="plate" data-act="combo" data-no="' + p.no + '" aria-label="배색 ' + p.no + '번, ' + p.c.length + '색, 여름뮤트에 어울리는 색 ' + (f.b + f.g) + '개">' + bands(p) +
    '<div class="cap"><span class="no num">' + p.no + '</span><span class="fitdots" aria-hidden="true">' + p.c.map(function (i) { return '<i class="' + (C[i].gr === 'best' ? 'b' : C[i].gr === 'good' ? 'g' : '') + '"></i>'; }).join('') + '</span><span class="lbl">' + (f.all ? '모두 어울림' : f.near ? '1색만 주의' : '') + '</span>' + (isFav(p.no) ? ic('saved', 'heart') : '') + '</div></button>';
}
function colorChip(c) {
  return '<button class="cc" data-act="color" data-i="' + c.i + '" aria-label="' + esc(c.n + ', ' + c.ko + ', ' + GRADE[c.gr]) + '"><div class="sw' + ghost(c.i) + '" style="background:' + c.hex + '">' + (c.gr === 'best' ? '<span class="st">' + ic('star') + '</span>' : '') + '</div><small>' + esc(c.ko) + '<br><span style="color:var(--mut)">' + esc(c.n) + '</span></small></button>';
}
function crow(i) {
  var c = C[i];

  if (!uniq.length) return { uniq: uniq, list: [] };
  var de = function (a, b) { var x = C[a].lab, y = C[b].lab; return Math.hypot(x[0] - y[0], x[1] - y[1], x[2] - y[2]); };   // 사진에서 고른 색과 거의 같은 책 색(ΔE<10)도 같은 색으로 침
  var list = P.map(function (p) { var m = uniq.filter(function (i) { return p.c.some(function (j) { return j === i || de(i, j) < 10; }); }).length; return { p: p, m: m }; }).filter(function (x) { return x.m > 0; })

}

function wear(no) {
  var p = byNo[no], o = S.outfit, used = Object.keys(o).map(function (k) { return o[k]; }), pool = p.c.filter(function (i) { return used.indexOf(i) < 0; });
  var lab = function (i) { var c = C[i].lab; return Math.hypot(c[1], c[2]); };
  var take = function (pick) { if (!pool.length) return null; var i = pick(pool.slice()); pool.splice(pool.indexOf(i), 1); return i; };
  var order = [['top', function (a) { return a.sort(function (x, y) { return C[y].s - C[x].s; })[0]; }], ['scarf', function (a) { return a.sort(function (x, y) { return C[y].s - C[x].s; })[0]; }],
    ['bag', function (a) { return a.sort(function (x, y) { return lab(y) - lab(x); })[0]; }], ['bottom', function (a) { return a.sort(function (x, y) { return lab(x) - lab(y); })[0]; }],
    ['outer', function (a) { return a.sort(function (x, y) { return lab(x) - lab(y); })[0]; }], ['shoes', function (a) { return a.sort(function (x, y) { return C[x].lab[0] - C[y].lab[0]; })[0]; }]];
  var filled = 0;
  ['bag', 'shoes'].forEach(function (k) { if (o[k] != null) return; var bad = pool.filter(function (i) { return !good(i); }); if (!bad.length) return; o[k] = bad[0]; pool.splice(pool.indexOf(bad[0]), 1); filled++; });   // 안 어울리는 색은 얼굴에서 먼 곳부터
  order.forEach(function (x) { if (o[x[0]] == null) { var i = take(x[1]); if (i != null) { o[x[0]] = i; filled++; } } });
  store.set('outfit', o); closeSheet(); S.tab = 'outfit'; store.set('tab', S.tab); render();
  toast(filled ? '빈 칸 ' + filled + '개를 배색 ' + no + '번 색으로 채웠어요' : SLOTS.some(function (x) { return o[x[0]] == null; }) ? '이 배색 색은 이미 모두 입고 있어요' : '빈 칸이 없어요 · 바꿀 칸을 눌러 고르세요');
}

// ---------- 렌더 ----------
var TABS = [['plates', '배색', 'plates'], ['colors', '색', 'colors'], ['outfit', '코디', 'outfit'], ['saved', '저장', 'saved']];
function render() {
  var app = document.getElementById('app'), y = window.scrollY;
  document.body.classList.toggle('lens-on', S.lens);
  app.innerHTML = '<header class="top"><h1>배색사전</h1><button class="lens" data-act="lens" aria-pressed="' + S.lens + '" title="여름뮤트에 어울리지 않는 색을 작게">' + '<span class="sw" aria-hidden="true"></span>여름뮤트</button></header>' +
    (S.tab === 'plates' ? viewPlates() : S.tab === 'colors' ? viewColors() : S.tab === 'outfit' ? viewOutfit() : viewSaved());
  document.getElementById('tabs').innerHTML = TABS.map(function (t) { return '<button data-act="tab" data-v="' + t[0] + '"' + (S.tab === t[0] ? ' aria-current="page"' : '') + '>' + ic(t[2]) + t[1] + '</button>'; }).join('');
  if (S.keep) window.scrollTo(0, y); S.keep = false;
}
var ACT = {
  tab: function (el) { if (document.querySelector('.sheet')) closeSheet(); S.tab = el.dataset.v; store.set('tab', S.tab); render(); window.scrollTo(0, 0); },
  lens: function () { S.lens = !S.lens; store.set('lens', S.lens); S.keep = true; render(); toast(S.lens ? '어울리지 않는 색을 작게 보여요' : '모든 색을 같은 크기로 보여요'); },
  size: function (el) { S.size = +el.dataset.v; S.keep = true; render(); },
  fam: function (el) { var v = +el.dataset.v; S.fam = S.fam === v ? -1 : v; S.keep = true; render(); },
  mineP: function (el) { var v = +el.dataset.v; S.mineP = S.mineP === v ? 0 : v; store.set('mineP', S.mineP); S.keep = true; render(); },
  quickTop: function (el) { S.outfit.top = +el.dataset.i; store.set('outfit', S.outfit); S.keep = true; render(); toast('상의에 넣었어요 · 아래 배색에서 입혀 보기'); },
  toSlot: function (el) { S.pickFor = el.dataset.k; ACT.setSlot(el); },
  mineC: function () { S.mineC = !S.mineC; store.set('mineC', S.mineC); S.keep = true; render(); },
  sort: function () { S.sort = S.sort === 'fit' ? 'no' : 'fit'; S.keep = true; render(); },
  combo: function (el) { comboSheet(+el.dataset.no); },
  color: function (el) { colorSheet(+el.dataset.i); },
  close: function () { closeSheet(); },
  fav: function (el) { var no = +el.dataset.no, k = S.favs.indexOf(no); if (k >= 0) S.favs.splice(k, 1); else S.favs.unshift(no); store.set('favs', S.favs); toast(k >= 0 ? '저장을 취소했어요' : '배색 ' + no + '번을 저장했어요'); comboSheet(no); S.keep = true; render(); },
  wear: function (el) { wear(+el.dataset.no); },
  slot: function (el) { pickerSheet(el.dataset.k); },
  setSlot: function (el) { var k = S.pickFor; if (!k) { colorSheet(+el.dataset.i); return; } var i = +el.dataset.i; if (i < 0) delete S.outfit[k]; else S.outfit[k] = i; store.set('outfit', S.outfit); closeSheet(); S.keep = true; render(); },
  saveLook: function () { var ks = Object.keys(S.outfit); if (!ks.length) { toast('먼저 색을 하나 이상 골라 주세요'); return; } var d = new Date(); S.looks.unshift({ name: (d.getMonth() + 1) + '월 ' + d.getDate() + '일 코디', o: JSON.parse(JSON.stringify(S.outfit)) }); store.set('looks', S.looks.slice(0, 60)); toast('코디를 저장했어요'); },
  clearLook: function () { S.outfit = {}; store.set('outfit', S.outfit); S.keep = true; render(); },
  loadLook: function (el) { S.outfit = JSON.parse(JSON.stringify(S.looks[+el.dataset.v].o)); store.set('outfit', S.outfit); S.tab = 'outfit'; store.set('tab', S.tab); render(); toast('코디를 불러왔어요'); },
  delLook: function (el) { S.looks.splice(+el.dataset.v, 1); store.set('looks', S.looks); S.keep = true; render(); toast('코디를 지웠어요'); }
};
document.addEventListener('click', function (e) { var el = e.target.closest('[data-act]'); if (!el || el.tagName === 'INPUT') return; var f = ACT[el.dataset.act]; if (f) { e.preventDefault(); f(el); } });
document.addEventListener('keydown', function (e) {
  var sh = document.querySelector('.sheet');
  if (sh && e.key === 'Tab') {   // 시트가 열려 있으면 Tab 이 시트 안에서만 돈다
    var f = [].slice.call(sh.querySelectorAll('button:not([disabled]),[role=button],input,label.btn')).filter(function (x) { return x.offsetParent !== null || x.tagName === 'INPUT'; });
    if (f.length) { var first = f[0], last = f[f.length - 1]; if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); } else if (!e.shiftKey && (document.activeElement === last || !sh.contains(document.activeElement))) { e.preventDefault(); first.focus(); } }
  }
  if (e.key === 'Escape' && sh) closeSheet(); var el = e.target.closest && e.target.closest('[role=button][data-act]'); if (el && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); ACT[el.dataset.act](el); } });
document.addEventListener('change', function (e) { if (e.target.dataset && e.target.dataset.act === 'photo') onPhoto(e.target); });
render();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
